<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  @page {
    size: 6in 9in;
    margin: 0.75in 0.7in 0.75in 0.7in;
    @bottom-center {
      content: counter(page);
      font-family: Georgia, serif;
      font-size: 9pt;
      color: #555;
    }
  }
  @page:first {
    margin: 0;
    @bottom-center { content: ''; }
  }
  body {
    font-family: 'Georgia', serif;
    font-size: 10pt;
    line-height: 1.55;
    color: #1a1a1a;
    margin: 0;
    padding: 0;
  }
  .cover-page {
    page-break-after: always;
    break-after: page;
    height: 100vh;
    width: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }
  .cover-page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
<div class='cover-page'>
  <img src='cover.jpg'>
</div>
<div style='page-break-before: always; text-align: center; padding-top: 2in;'>
  <h1 style='font-size: 24pt; font-weight: normal; letter-spacing: 2px;'>GHOST DOGMAS</h1>
  <p style='font-size: 12pt; color: #444; margin-top: 10px;'>Rewiring the Subconscious Theology of Your Nervous System</p>
  <div style='margin-top: 2in; font-size: 13pt;'>Mario Botha</div>
</div>
</body>
</html>
